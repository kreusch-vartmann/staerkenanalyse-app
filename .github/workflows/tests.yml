name: Tests & Coverage

on:
  push:
    branches: [main, feature/*]
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
      - 'pytest.ini'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'requirements.txt'

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask pytest-cov coverage coverage-badge
      
      - name: Run Tests with Coverage
        run: |
          coverage run -m pytest tests/ -v --tb=short
          coverage report --skip-empty
          coverage html -d htmlcov
          coverage xml
      
      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Generate Coverage Badge
        run: |
          coverage-badge -o htmlcov/coverage.svg -f
      
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
      
      - name: Test Results Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pytest tests/ --tb=no -q 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
          coverage report --skip-empty --format=markdown >> $GITHUB_STEP_SUMMARY

  coverage-threshold:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov coverage
      
      - name: Check Coverage Threshold
        run: |
          coverage run -m pytest tests/ -q
          coverage report --fail-under=40 --skip-empty
        continue-on-error: true

  lint-tests:
    name: Lint Test Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Linters
        run: |
          pip install pylint flake8
      
      - name: Lint Test Files
        run: |
          flake8 tests/ --count --exit-zero --max-line-length=127
          pylint tests/ --disable=all --enable=E,F || true
        continue-on-error: true
