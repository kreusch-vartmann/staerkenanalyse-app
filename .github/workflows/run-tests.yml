name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcairo2-dev \
          libpango1.0-dev \
          libgdk-pixbuf2.0-dev \
          libffi-dev \
          shared-mime-info
    
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Initialize database
      run: python scripts/init_test_db.py
    
    - name: Run Unit Tests
      env:
        FLASK_ENV: testing
        DATABASE_URL: sqlite:///test.db
        SECRET_KEY: test-secret-key-ci
        WTF_CSRF_ENABLED: 'False'
      run: |
        pytest tests/unit/ -v --tb=short
    
    - name: Run Integration Tests
      env:
        FLASK_ENV: testing
        DATABASE_URL: sqlite:///test.db
        SECRET_KEY: test-secret-key-ci
        WTF_CSRF_ENABLED: 'False'
      run: |
        pytest tests/integration/ -v --tb=short
    
    - name: Run Full Test Suite with Coverage
      env:
        FLASK_ENV: testing
        DATABASE_URL: sqlite:///test.db
        SECRET_KEY: test-secret-key-ci
        WTF_CSRF_ENABLED: 'False'
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term -v
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Archive Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30
    
    - name: Check Coverage Threshold
      run: |
        coverage report --fail-under=40
      continue-on-error: true
    
    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f coverage.xml ]; then
          echo "**Coverage Report:**" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY 2>/dev/null || coverage report >> $GITHUB_STEP_SUMMARY
        fi
