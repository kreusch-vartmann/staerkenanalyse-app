name: CI - Code Quality

on:
  push:
    branches: [main, feature/*]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/ci-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'

jobs:
  lint:
    name: Linting (Black, Flake8, isort)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.1.1 flake8==7.3.0 isort==6.0.1 pylint==3.3.8
      
      - name: Run Black (Code Formatting Check)
        run: |
          black --check --diff --color . \
            --exclude="venv*|.venv|htmlcov|migrations|backups|uploads|instance|__pycache__"
        continue-on-error: true
      
      - name: Run isort (Import Sorting Check)
        run: |
          isort --check-only --diff . \
            --skip-glob="venv*" \
            --skip-glob=".venv" \
            --skip-glob="htmlcov" \
            --skip-glob="migrations" \
            --skip-glob="backups" \
            --skip-glob="uploads" \
            --skip-glob="instance" \
            --skip-glob="__pycache__"
        continue-on-error: true
      
      - name: Run Flake8 (Style & Error Check)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.git,__pycache__,venv*,.venv,htmlcov,migrations,backups,uploads,instance
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
            --exclude=.git,__pycache__,venv*,.venv,htmlcov,migrations,backups,uploads,instance
      
      - name: Run Pylint (Deep Code Analysis)
        run: |
          pylint --rcfile=.pylintrc $(find . -name "*.py" | grep -v venv | grep -v migrations) || true
        continue-on-error: true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Security Tools
        run: |
          pip install bandit pip-audit
      
      - name: Run Bandit (Security Linter)
        run: |
          bandit -r . -x ./venv,./migrations -f json -o bandit-report.json || true
          bandit -r . -x ./venv,./migrations
        continue-on-error: true
      
      - name: Run pip-audit (Dependency Vulnerabilities)
        run: |
          pip-audit --desc --requirement requirements.txt
        continue-on-error: true

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Radon
        run: pip install radon
      
      - name: Cyclomatic Complexity Check
        run: |
          echo "## Cyclomatic Complexity Report" >> $GITHUB_STEP_SUMMARY
          radon cc . -a -nb --md >> $GITHUB_STEP_SUMMARY || true
      
      - name: Maintainability Index
        run: |
          echo "## Maintainability Index" >> $GITHUB_STEP_SUMMARY
          radon mi . --md >> $GITHUB_STEP_SUMMARY || true
