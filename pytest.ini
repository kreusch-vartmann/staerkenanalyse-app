[pytest]
# Pytest-Konfiguration für Stärkenanalyse-App
# 
# 🛡️ IMPORTANT: Tests laufen IMMER mit isolierter Datenbank!
# Production-DB wird NIEMALS von Tests berührt.

# Test-Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output-Optionen
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -p no:cacheprovider

# 🛡️ SAFETY: Markers für Test-Kategorisierung (und Sicherheits-Validierung)
markers =
    unit: Unit-Tests für einzelne Funktionen/Klassen
    integration: Integration-Tests für Blueprints und Workflows
    e2e: End-to-End-Tests für komplette User-Journeys
    slow: Langsame Tests (z.B. KI-API-Calls)
    requires_api: Tests die externe APIs benötigen (Mistral, Gemini)
    database: Tests die Datenbank-Zugriff benötigen
    safety: 🛡️ Database Isolation Safety Tests (IMMER zuerst!)
    rbac: Tests für RBAC Permission System

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage-Optionen (wenn pytest-cov installiert ist)
# Run mit: pytest --cov=. --cov-report=html

# 🛡️ EXECUTION ORDER: safety tests always run first
# This ensures database isolation is validated before other tests
junit_family = xunit2

