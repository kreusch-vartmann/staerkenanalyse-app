[pytest]
# Pytest-Konfiguration für Stärkenanalyse-App

# Test-Discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output-Optionen
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers für Test-Kategorisierung
markers =
    unit: Unit-Tests für einzelne Funktionen/Klassen
    integration: Integration-Tests für Blueprints und Workflows
    e2e: End-to-End-Tests für komplette User-Journeys
    slow: Langsame Tests (z.B. KI-API-Calls)
    requires_api: Tests die externe APIs benötigen (Mistral, Gemini)
    database: Tests die Datenbank-Zugriff benötigen

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage-Optionen (wenn pytest-cov installiert ist)
# Run mit: pytest --cov=. --cov-report=html
