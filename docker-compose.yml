version: '3.8'

services:
  # PostgreSQL Datenbank
  db:
    image: postgres:16-alpine
    container_name: staerkenanalyse_db
    environment:
      POSTGRES_DB: staerkenanalyse_db
      POSTGRES_USER: staerkenanalyse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staerkenanalyse_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Flask Web Application
  web:
    build: .
    container_name: staerkenanalyse_web
    environment:
      - FLASK_APP=app.py
      - DATABASE_URL=postgresql://staerkenanalyse_user:${DB_PASSWORD:-changeme_secure_password}@db:5432/staerkenanalyse_db
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - FLASK_DEBUG=False
      - FLASK_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./instance:/app/instance
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        flask db upgrade &&
        gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 app:app
      "

volumes:
  postgres_data:
    driver: local
