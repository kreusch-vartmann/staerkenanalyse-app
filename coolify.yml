# Coolify Deployment Configuration
# Docs: https://coolify.io/docs

version: "1.0"

services:
  postgres:
    image: postgres:16-alpine
    type: postgresql
    environment:
      POSTGRES_USER: stark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stark"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    type: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - app_network

  app:
    type: web
    build: .
    environment:
      DATABASE_URL: postgresql://stark:${POSTGRES_PASSWORD}@postgres:5432/stark
      RATELIMIT_STORAGE_URI: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge