{% extends "base.html" %}

{% block title %}Fehler{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-md mt-10">
    <div class="flex items-center mb-4">
        <i class="fas fa-exclamation-triangle text-red-500 text-3xl mr-3"></i>
        <h1 class="text-2xl font-bold text-gray-800">Ein Fehler ist aufgetreten</h1>
    </div>
    <p class="text-gray-600 mb-4">
        Es ist ein unerwarteter Fehler aufgetreten. Bitte versuche es später erneut.
    </p>
    <div class="bg-gray-50 p-4 rounded-md">
        <p class="text-sm text-gray-500">
            <strong>Fehler-ID:</strong> {{ error_id }}
        </p>
    </div>
    <a href="{{ url_for('dashboard') }}" class="inline-block mt-6 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">
        Zurück zum Dashboard
    </a>
</div>
{% endblock %}
