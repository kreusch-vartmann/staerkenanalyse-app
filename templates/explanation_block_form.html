{% extends 'base.html' %}

{% block title %}{% if block %}Textblock bearbeiten{% else %}Neuer Textblock{% endif %}{% endblock %}

{% block content %}
<div class="mb-6">
    <h2 class="text-3xl font-bold text-gray-800">
        {% if block %}Textblock bearbeiten{% else %}Neuer Textblock{% endif %}
    </h2>
</div>

<div class="bg-white shadow-md rounded-lg p-6">
    <form method="POST">
        <div class="mb-4">
            <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                Titel <span class="text-red-500">*</span>
            </label>
            <input type="text" name="title" id="title" required
                   value="{% if block %}{{ block.title }}{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                   placeholder="z.B. Einleitung Kompetenzbereiche">
        </div>
        
        <div class="mb-4">
            <label for="order" class="block text-sm font-medium text-gray-700 mb-2">
                Reihenfolge
            </label>
            <input type="number" name="order" id="order" 
                   value="{% if block %}{{ block.order }}{% else %}0{% endif %}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"
                   placeholder="0">
            <p class="text-sm text-gray-500 mt-1">Niedrigere Zahlen erscheinen zuerst</p>
        </div>
        
        <div class="mb-6">
            <label for="content" class="block text-sm font-medium text-gray-700 mb-2">
                Inhalt
            </label>
            <textarea name="content" id="content" rows="15"
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 font-mono text-sm"
                      placeholder="Geben Sie hier den Erklärungstext ein...">{% if block %}{{ block.content }}{% endif %}</textarea>
        </div>
        
        <div class="flex gap-3">
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                <i class="fas fa-save me-2"></i>Speichern
            </button>
            <a href="{{ url_for('explanation_blocks.manage_explanation_blocks') }}" 
               class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">
                <i class="fas fa-times me-2"></i>Abbrechen
            </a>
        </div>
    </form>
</div>

{% endblock %}
