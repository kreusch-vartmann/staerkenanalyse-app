{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row mb-3">
        <div class="col-md-12">
            <h2>Template: {{ template.name }}</h2>
            <p class="text-muted">{{ template.description or 'Keine Beschreibung' }}</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <h5>Design-Konfiguration</h5>
            <table class="table table-sm table-bordered">
                <tbody>
                    {% for key, value in design_config.items() %}
                    <tr>
                        <th>{{ key }}</th>
                        <td>{{ value }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <a href="{{ url_for('reports.list_templates') }}" class="btn btn-secondary">
        ← Zurück zur Liste
    </a>
</div>
{% endblock %}
